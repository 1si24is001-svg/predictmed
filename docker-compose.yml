version: "3.8"

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: predictmed-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:16-alpine
    container_name: predictmed-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: predictmed
      POSTGRES_PASSWORD: predictmed_secret
      POSTGRES_DB: predictmed
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: predictmed-minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: predictmed-iceberg-rest
    ports: ["8181:8181"]
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    depends_on:
      - minio

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: predictmed-mlflow
    ports: ["5000:5000"]
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://predictmed:predictmed_secret@postgres:5432/predictmed --default-artifact-root s3://warehouse/mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
    depends_on:
      - postgres
      - minio

  api:
    image: python:3.10-slim
    container_name: predictmed-api
    working_dir: /app
    volumes: [".:/app"]
    environment:
      - PYTHONPATH=src
      - PREDICTMED_DATABASE_URL=postgresql://predictmed:predictmed_secret@postgres:5432/predictmed
    command: bash -c "pip install -q -r requirements.txt && uvicorn predictmed.serving.api:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      - postgres
      - kafka

  frontend:
    image: node:20-alpine
    container_name: predictmed-frontend
    working_dir: /app/frontend
    volumes: ["./frontend:/app/frontend"]
    command: sh -c "npm install && npm run build && npx vite preview --host 0.0.0.0 --port 5173"
    ports: ["5173:5173"]
    depends_on:
      - api
